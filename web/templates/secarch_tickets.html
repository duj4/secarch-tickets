<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SecArch Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
</head>

<body class="bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Title -->
    <h1 class="text-2xl font-bold text-center mb-6">
      SecArch Tickets
    </h1>

    <!-- Controls -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
      <div class="flex flex-wrap items-center justify-between gap-4">

        <!-- Left: Search / PageSize / Status / Refresh -->
        <div class="flex items-center gap-3">

          <input id="search" placeholder="Search ticket..." class="border px-3 py-2 rounded-full w-64">

          <select id="pageSize" class="border px-3 py-2 rounded-full">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>

          <select id="statusFilter" class="border px-3 py-2 rounded-full">
            <option value="all" selected>All Status</option>
            <option value="open">Open</option>
            <option value="closed">Closed</option>
          </select>

          <button onclick="loadTickets()" class="bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600">
            Refresh
          </button>
        </div>

        <!-- Right: Add + Export -->
        <div class="flex items-center gap-4">

          <!-- Add -->
          <div class="flex items-center gap-3">
            <input id="newTicket" placeholder="ITSM-12345" class="border px-3 py-2 rounded-full w-40">

            <input id="newExpectedDate" type="date" class="border px-3 py-2 rounded-full">

            <button id="addBtn" onclick="addTicket()"
              class="bg-green-500 text-white px-4 py-2 rounded-full hover:bg-green-600">
              Add
            </button>
          </div>

          <!-- Export -->
          <div class="relative">

            <!-- 按钮 -->
            <button onclick="toggleExport()" class="bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600">
              Export CSV
            </button>

            <!-- Panel -->
            <div id="exportPanel"
              class="hidden absolute right-0 mt-2 bg-white shadow-lg rounded-xl p-4 w-auto min-w-[340px] max-w-[380px] z-50">

              <!-- Quick -->
              <div class="flex justify-center gap-3 mb-3">
                <button onclick="quickExport(30)" class="px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 text-sm">
                  Last 30 days
                </button>
                <button onclick="quickExport(180)" class="px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 text-sm">
                  Last 180 days
                </button>
                <button onclick="quickExport(365)" class="px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 text-sm">
                  Last 365 days
                </button>
              </div>

              <!-- Divider -->
              <div class="border-t my-2"></div>

              <!-- Date range -->
              <div class="flex items-center gap-2 w-full">
                <input id="exportStart" type="date" class="border px-3 py-2 rounded flex-1 min-w-[150px]">

                <span class="text-sm text-gray-500">to</span>

                <input id="exportEnd" type="date" class="border px-3 py-2 rounded flex-1 min-w-[150px]">
              </div>

              <!-- Button -->
              <button onclick="confirmExport()"
                class="mt-3 w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                Export
              </button>

            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="min-w-full text-sm">

        <thead class="bg-gray-50 text-gray-600 text-xs uppercase sticky top-0 z-10">
          <tr>
            <th class="px-4 py-3 cursor-pointer hover:text-blue-600" onclick="sortBy('ticket_number')">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Ticket <span id="sort-ticket_number"></span>
              </div>
            </th>
            <th class="px-4 py-3">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Summary
              </div>
            </th>
            <th class="px-4 py-3 cursor-pointer hover:text-blue-600" onclick="sortBy('cmdb_system_name')">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                System <span id="sort-cmdb_system_name"></span>
              </div>
            </th>
            <th class="px-4 py-3 cursor-pointer hover:text-blue-600" onclick="sortBy('reporter')">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Reporter <span id="sort-reporter"></span>
              </div>
            </th>
            <th class="px-4 py-3 cursor-pointer hover:text-blue-600" onclick="sortBy('assignee')">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Assignee <span id="sort-assignee"></span>
              </div>
            </th>
            <th class="px-4 py-3 cursor-pointer hover:text-blue-600" onclick="sortBy('expected_date')">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Expected <span id="sort-expected_date"></span>
              </div>
            </th>
            <th class="px-4 py-3">
              <div class="flex items-center justify-center gap-1 whitespace-nowrap">
                Status
              </div>
            </th>
            <th class="px-4 py-3">
              Action
            </th>
          </tr>
        </thead>

        <tbody id="tbody"></tbody>

      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-between items-center mt-4 text-sm">
      <div id="pageInfo"></div>

      <div class="flex gap-2">
        <button id="prevBtn" onclick="prevPage()" class="border px-3 py-1 rounded">Prev</button>
        <button id="nextBtn" onclick="nextPage()" class="border px-3 py-1 rounded">Next</button>
      </div>
    </div>

  </div>

  <!-- Modal for View Ticket -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-[500px] p-6 relative">

      <h2 class="text-lg font-semibold mb-4">Ticket Details</h2>

      <div id="modalContent" class="text-sm space-y-2"></div>

      <button onclick="closeModal()" class="mt-4 px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
        Close
      </button>

    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="fixed top-5 right-5 space-y-2 z-50"></div>

  <script src="/static/js/secarch_tickets.js"></script>

</body>

</html>
